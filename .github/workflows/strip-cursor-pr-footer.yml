# Cursor Cloud Agents inject Open in Web / Open in Cursor buttons into PR
# bodies (server-side; cannot be disabled). Strip that HTML so public PRs
# do not advertise agent run URLs.
name: Strip Cursor PR footer

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:
    inputs:
      all:
        description: Clean every pull request, including merged/closed
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test footer stripper
        working-directory: .github/scripts
        run: python3 strip_cursor_pr_footer_test.py

  strip:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Strip Cursor agent footer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRIP_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        working-directory: .github/scripts
        run: |
          set -euo pipefail
          if [[ "${STRIP_ALL}" == "true" ]]; then
            python3 strip_cursor_pr_footer.py --repo "${GITHUB_REPOSITORY}" --all
          else
            python3 strip_cursor_pr_footer.py --repo "${GITHUB_REPOSITORY}" --pr "${PR_NUMBER}"
          fi
